[project]
name = "portproject-rag"
version = "0.1.0"
description = "Corpus-aware local PDF ingestion for PostgreSQL and pgvector"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "PyMuPDF>=1.26,<2",
  "pdfplumber>=0.11,<1",
  "pypdf>=5,<7",
  "pytesseract>=0.3,<1",
  "Pillow>=10,<12",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "bcrypt>=4.2,<5",
  "reportlab>=4.2,<5",
  "sentence-transformers>=5.7,<6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]
billing-training = [
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
]

[project.scripts]
portproject-rag = "portproject_rag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
