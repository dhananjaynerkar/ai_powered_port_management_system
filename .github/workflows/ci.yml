name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    env:
      # The application requires a DSN at import time. This is a non-operational
      # placeholder used only by tests that do not require a live database.
      PORTPROJECT_RAG_DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: ruff check src tests
      - name: Run database-independent Python tests
        run: >-
          pytest -q
          --ignore=tests/test_authority_metrics.py
          --ignore=tests/test_live_corpus_evaluation.py
          --ignore=tests/test_rag_gold_set.py
          --ignore=tests/test_tenant_pagination.py
          --ignore=tests/acceptance

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
